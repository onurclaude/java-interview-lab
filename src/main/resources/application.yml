spring:
  application:
    name: java-interview-lab

  datasource:
    url: jdbc:postgresql://localhost:5434/interviewlab
    username: interviewlab
    password: interviewlab
    hikari:
      # Deliberately small pool: several labs (pessimistic locking, deadlock,
      # propagation) hold a connection for the whole transaction on purpose,
      # and a small pool makes "this thread is now blocked waiting on a
      # connection/lock" visible quickly instead of hiding it behind 10 spare
      # connections. See docs/pessimistic-locking.md.
      maximum-pool-size: 8

  jpa:
    hibernate:
      # Şema artık Flyway migration'ları (src/main/resources/db/migration) tarafından
      # yönetiliyor - Hibernate açılışta şemayı DEĞİŞTİRMEZ, sadece entity mapping'lerinin
      # migration'ların oluşturduğu tablolarla eşleştiğini doğrular. Bu, hem `docker compose
      # up` ile ayağa kaldırılan dev Postgres'inde hem de testlerin Testcontainers
      # Postgres'inde aynı, tek gerçek şema kaynağını garanti eder.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # 8080, bu makinede port-ofis-backend tarafından zaten kullanılıyor - çakışmayı önlemek
  # için bilinçli olarak 8082 seçildi. Bkz. README.md.
  port: 8082

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.interviewlab: DEBUG
    LAB: INFO
    # Interactive dev modunda (bu dosya) Hibernate SQL + bind parametreleri her zaman AÇIK -
    # /api/labs/* çağırdığında konsolda gerçek SQL'i görmen bunun için var. `test` profili
    # (application-test.yml) bunu bilerek tekrar kapatır: 30+ lab tek bir datasource'u
    # paylaşırken bunu testlerde açık bırakmak her testin konsolunu boğardı - testler zaten
    # SqlStatementRecorder ile gerçek SQL üzerinde doğrudan assertion yapıyor.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
