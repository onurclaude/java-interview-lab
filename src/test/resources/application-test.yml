spring:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        jdbc:
          batch_size: 20

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - %msg%n"
  level:
    # Ana application.yml, interactive dev modu için Hibernate SQL logging'i her zaman açık
    # bırakır - testlerde bunu bilerek tekrar kapatıyoruz, aksi halde 30+ lab paylaşılan tek
    # bir datasource üzerinde her testin konsolunu boğardı (testler zaten SqlStatementRecorder
    # ile gerçek SQL üzerinde doğrudan assertion yapıyor, log satırlarına güvenmiyor).
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: WARN
