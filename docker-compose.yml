services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-lab-postgres
    environment:
      POSTGRES_DB: interviewlab
      POSTGRES_USER: interviewlab
      POSTGRES_PASSWORD: interviewlab
    ports:
      # 5434 - 5432/5433, bu makinedeki diğer projelerin (port-ofis, cafe-menu-db) zaten
      # kullandığı portlar olduğu için bilinçli olarak seçildi. Bkz. README.md.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewlab -d interviewlab"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - interview-lab-pgdata:/var/lib/postgresql/data

volumes:
  interview-lab-pgdata:
