services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-lab-postgres
    environment:
      POSTGRES_DB: interviewlab
      POSTGRES_USER: interviewlab
      POSTGRES_PASSWORD: interviewlab
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewlab -d interviewlab"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - interview-lab-pgdata:/var/lib/postgresql/data

volumes:
  interview-lab-pgdata:
